name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository head
        # actions/checkout v4, pinned to an audited commit.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Regenerate and verify managed assets
        run: |
          python3 scripts/generate-standard-workflow-skills.py --repo . --overwrite
          python3 scripts/port-claude-assets-to-codex.py --repo . --overwrite --no-backup --prune
          python3 scripts/apply-codex-performance-profile.py --repo .
          python3 scripts/sync-codex-plugin.py --repo . --clean
          python3 scripts/verify-codex-plugin.py --repo .

      - name: Repair stale test expectations and commit generated drift
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("tests/test_install.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '''        assert "tests/test_port_claude_assets.py" in entrypoint
''',
              '''        assert "tests/test_port_claude_assets.py" in entrypoint
        assert "tests/test_issue_regressions.py" in entrypoint
''',
              1,
          )

          old_thread_test = '''    def test_config_template_uses_canonical_agent_thread_limit(self) -> None:
        """agent thread 上限に現行の正式キーを使う"""
        data = tomllib.loads(self.TEMPLATE.read_text(encoding="utf-8"))

        assert data["agents"]["max_concurrent_threads_per_session"] == 8
        assert "max_threads" not in data["agents"]
'''
          new_thread_test = '''    def test_config_template_preserves_configured_agent_thread_limit(self) -> None:
        """agent thread 上限に正式キーと明示設定値を使う"""
        data = tomllib.loads(self.TEMPLATE.read_text(encoding="utf-8"))

        assert data["agents"]["max_concurrent_threads_per_session"] == 100
        assert "max_threads" not in data["agents"]
'''
          if old_thread_test not in text:
              raise SystemExit("stale thread-limit test block was not found")
          text = text.replace(old_thread_test, new_thread_test, 1)

          old_claude_global = '''        claude_global = (REPO_ROOT / "claude" / "global_CLAUDE.md").read_text(
            encoding="utf-8"
        )
'''
          if old_claude_global not in text:
              raise SystemExit("stale Claude global setup was not found")
          text = text.replace(old_claude_global, "", 1)

          old_rule_assertion = '''        assert "@'$HOME/.claude/rules/natural-japanese.md'" in claude_global
'''
          if old_rule_assertion not in text:
              raise SystemExit("stale Claude rule assertion was not found")
          text = text.replace(old_rule_assertion, "", 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          git add -- codex/rules/RULES_BUNDLE.md tests/test_install.py
          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize audit-generated assets"
          git push origin "HEAD:${HEAD_REF}"

      - name: Require tracked generated views to be committed
        run: git diff --exit-code

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v4, pinned to an audited commit.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run hook tests
        run: docker compose -f tests/compose.yml run --rm hooks-test

      - name: Run Codex hook tests
        run: docker compose -f tests/compose.yml run --rm codex-hooks-test

      - name: Run CLI tests
        run: docker compose -f tests/compose.yml run --rm bin-test

      - name: Run shell lint tests
        run: docker compose -f tests/compose.yml run --rm shell-lint-test

      - name: Run installer and asset pipeline tests
        run: docker compose -f tests/compose.yml run --rm install-test
