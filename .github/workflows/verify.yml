name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5, pinned to an audited commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Regenerate and verify managed assets
        run: |
          python3 scripts/generate-standard-workflow-skills.py --repo . --overwrite
          python3 scripts/port-claude-assets-to-codex.py --repo . --overwrite --no-backup --prune
          python3 scripts/apply-codex-performance-profile.py --repo .
          python3 scripts/sync-codex-plugin.py --repo . --clean
          python3 scripts/verify-codex-plugin.py --repo .

      - name: Require generated views to be committed
        run: |
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard -- codex/skills codex/rules)"
          if [ -n "$untracked" ]; then
            printf 'Untracked generated views:\n%s\n' "$untracked" >&2
            exit 1
          fi

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v5, pinned to an audited commit.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run hook tests
        run: docker compose -f tests/compose.yml run --rm hooks-test

      - name: Run Codex hook tests
        run: docker compose -f tests/compose.yml run --rm codex-hooks-test

      - name: Run CLI tests
        run: docker compose -f tests/compose.yml run --rm bin-test

      - name: Run shell lint tests
        run: docker compose -f tests/compose.yml run --rm shell-lint-test

      - name: Run installer and asset pipeline tests
        run: docker compose -f tests/compose.yml run --rm install-test
