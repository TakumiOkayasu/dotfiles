services:
  hooks-test:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /workspace/hooks &&
        cp -a /workspace/source-hooks/. /workspace/hooks/ &&
        cp -a /workspace/common-hooks/. /workspace/hooks/ &&
        chmod +x /workspace/hooks/*.sh &&
        HOOK_DIR=/workspace/hooks sh /workspace/test_hooks.sh
    volumes:
      - ../claude/hooks:/workspace/source-hooks:ro
      - ../common/hooks:/workspace/common-hooks:ro
      - ./test_hooks.sh:/workspace/test_hooks.sh:ro
  codex-hooks-test:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /workspace/hooks &&
        cp -a /workspace/source-hooks/. /workspace/hooks/ &&
        cp -a /workspace/common-hooks/. /workspace/hooks/ &&
        chmod +x /workspace/hooks/*.sh &&
        HOOK_DIR=/workspace/hooks sh /workspace/test_codex_hooks.sh
    volumes:
      - ../codex/hooks:/workspace/source-hooks:ro
      - ../common/hooks:/workspace/common-hooks:ro
      - ../codex/bin:/workspace/bin:ro
      - ./test_codex_hooks.sh:/workspace/test_codex_hooks.sh:ro
  bin-test:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    entrypoint:
      - sh
      - -c
      - |
        /workspace/test_bin.sh &&
        sh /workspace/test_git_new_feature_validation.sh
    volumes:
      - ../bin:/workspace/bin:ro
      - ../claude/notes:/workspace/claude/notes:ro
      - ../claude/scratch:/workspace/claude/scratch:ro
      - ./test_bin.sh:/workspace/test_bin.sh:ro
      - ./test_git_new_feature_validation.sh:/workspace/test_git_new_feature_validation.sh:ro
  shell-lint-test:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    entrypoint: ["sh", "/workspace/tests/test_shell_lint.sh"]
    volumes:
      - ..:/workspace:ro
  install-test:
    build:
      context: ..
      dockerfile: tests/Dockerfile.install
